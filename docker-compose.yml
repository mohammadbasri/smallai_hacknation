# Dev convenience. Production / edge box / Hugging Face Space use the single root Dockerfile instead.
services:
  karibu:
    build: .
    ports:
      - "7860:7860"
    environment:
      CONFIDENCE_THRESHOLD: "0.65"
      DEFAULT_LANGUAGE: sw
      SMS_PROVIDER: console
      # SMS_PROVIDER: africastalking
      # AT_USERNAME: sandbox
      # AT_API_KEY: ...
      # SMS_OPERATOR_NUMBER: "+2547..."
      # SMS_SERVICE_NUMBER: "+2547..."
    volumes:
      - karibu-data:/data

volumes:
  karibu-data:
