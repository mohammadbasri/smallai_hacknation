services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CONFIDENCE_THRESHOLD: "0.65"
      DEFAULT_LANGUAGE: sw
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
